<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d94531">
<meta name="description" content="Una invitación muy especial para Gabriela. Retira cada sushi del plato para descubrirla.">
<title>Para Gabriela · Una invitación especial</title>
<style>
:root { --red:#d84430; --red-dark:#a82d22; --cream:#f6ebcf; --cream-dark:#e9d6b6; --ink:#222626; --blue:#1e4a5b; --gold:#edba68; }
* { box-sizing:border-box; }
html { min-height:100%; background:#292827; }
body { margin:0; min-height:100dvh; display:flex; justify-content:center; align-items:center; background:#292827; color:var(--cream); -webkit-font-smoothing:antialiased; }
button,svg { -webkit-tap-highlight-color:transparent; }
.poster { position:relative; display:flex; flex-direction:column; isolation:isolate; overflow:hidden; width:min(100%,525px); min-height:100dvh; background:var(--red); border:8px solid var(--cream); box-shadow:0 14px 75px #0007; }
.poster::before { content:""; pointer-events:none; position:absolute; z-index:10; inset:0; opacity:.15; mix-blend-mode:multiply; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.73' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E"); }
.poster::after { content:""; position:absolute; z-index:9; pointer-events:none; inset:11px; border:1.5px solid #f6e7be73; }
.paper-grain { position:absolute; pointer-events:none; inset:0; background:radial-gradient(ellipse at 55% 45%, transparent 40%, #811a131f 100%); z-index:0; }
.masthead { position:relative; z-index:1; flex:0 0 auto; padding:18px 27px 0; }
.masthead-line { display:flex; align-items:center; justify-content:space-between; padding-bottom:11px; border-bottom:1.5px solid #f8dfb9a9; font:700 10px/1.1 'Arial Narrow',Arial,sans-serif; letter-spacing:.19em; color:var(--cream); }
.masthead-line .kanji { font-size:20px; letter-spacing:0; font-weight:500; }
.masthead-line .mark { font-size:17px; font-weight:400; }
.title-wrap { position:relative; padding-top:18px; }
h1 { position:relative; z-index:2; margin:0; color:var(--cream); font-family:Georgia,'Times New Roman',serif; font-weight:900; font-size:clamp(53px,12.4vw,75px); line-height:.91; letter-spacing:-.07em; text-shadow:2px 2px 0 #ae3025; }
h1 .second { display:block; margin-left:4px; font-size:1.09em; font-style:italic; }
.sun-badge { position:absolute; right:0; top:19px; width:88px; height:88px; border-radius:50%; background:var(--cream); border:3px solid var(--ink); display:grid; place-items:center; color:var(--red); font-size:40px; font-weight:800; font-family:serif; transform:rotate(10deg); box-shadow:4px 5px 0 #ab2c22; }
.sun-badge::after { content:""; position:absolute; inset:9px; border:1px solid #cf594a; border-radius:50%; }
.instruction { display:flex; gap:8px; align-items:center; width:max-content; margin:17px 0 0 4px; padding:8px 13px 7px; color:var(--cream); font:700 11px/1 Arial,sans-serif; letter-spacing:.13em; border:1px solid var(--cream); transform:rotate(-2deg); }
.instruction .down { display:inline-block; font-size:17px; margin-top:-2px; animation:hintbob 1.6s ease-in-out infinite; }
@keyframes hintbob { 50% {transform:translateY(4px)} }
.artwork { position:relative; display:flex; flex:1 1 auto; align-items:center; justify-content:center; min-height:300px; margin:0 8px; z-index:1; }
.artwork::before { content:""; position:absolute; width:93%; height:74%; left:3.5%; top:14%; border:2px solid #f3d8b375; border-radius:50%; pointer-events:none; transform:rotate(-10deg); }
#sushi-stage { display:block; width:100%; height:auto; overflow:visible; max-height:500px; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
.sushi-piece { cursor:grab; outline:none; touch-action:none; }
.sushi-piece:active { cursor:grabbing; }
.sushi-piece:focus-visible .focus-ring { opacity:1; }
.focus-ring { opacity:0; fill:none; stroke:#f6edcc; stroke-width:4; stroke-dasharray:5 7; }
.sushi-piece .piece-art { transform-box:fill-box; transform-origin:center; filter:drop-shadow(4px 6px 1px #12171952); }
.sushi-piece.dragging .piece-art { filter:drop-shadow(7px 12px 3px #12171965); }
.sushi-piece.leaving { pointer-events:none; }
.sushi-piece.leaving .piece-art { animation:takeaway .48s cubic-bezier(.23,.85,.36,1) forwards; }
@keyframes takeaway { 0% {transform:translate(0,0) rotate(0deg) scale(1);opacity:1} 100% {transform:translate(12px,-115px) rotate(29deg) scale(.55);opacity:0} }
#hidden-invitation { opacity:.92; }
#hidden-invitation .invite-line { font-family:Georgia,'Times New Roman',serif; font-weight:900; fill:#ab3428; letter-spacing:1px; }
#hidden-invitation .invite-line.big { font-size:32px; }
#hidden-invitation .invite-line.mid { font-size:27px; }
#hidden-invitation .invite-line.small { font-size:24px; }
#hidden-invitation .invite-accent { fill:none; stroke:#275261; stroke-width:2.5; opacity:.55; stroke-linecap:round; }
.illustration-label { position:absolute; bottom:3px; font:700 9px/1 Arial,sans-serif; letter-spacing:.22em; color:#f7e7c8b8; }
.closing { flex:0 0 auto; position:relative; z-index:2; background:var(--cream); color:var(--ink); padding:16px 27px max(19px, env(safe-area-inset-bottom)); border-top:8px solid var(--ink); }
.closing:before { content:""; position:absolute; left:0; right:0; top:-13px; border-top:2px solid var(--cream); }
.close-topline { display:flex; justify-content:space-between; align-items:center; color:var(--red-dark); font:900 10px Arial,sans-serif; letter-spacing:.18em; margin-bottom:9px; }
.closing h2 { font-family:Georgia,'Times New Roman',serif; font-size:clamp(28px,7.9vw,39px); line-height:1.12; letter-spacing:-.055em; margin:0; padding-right:37px; font-weight:900; }
.closing h2 .sushi-word { color:var(--red); font-style:italic; white-space:nowrap; }
.closing .stamp { position:absolute; right:27px; top:30px; display:grid; place-items:center; width:28px; height:28px; color:var(--red-dark); border:3px solid var(--red-dark); border-radius:50%; font:600 16px serif; transform:rotate(-14deg); opacity:.85; }
.closing .rule { margin-top:27px; height:4px; background:var(--ink); border-top:1px solid var(--cream); box-shadow:0 3px 0 var(--ink); }
.replay { display:none; margin-top:16px; padding:10px 16px; border:2px solid var(--ink); background:var(--red); color:#fff1d8; font:700 12px/1 Arial,sans-serif; letter-spacing:.11em; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
.poster.complete .replay { display:inline-block; }
.sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (min-width:600px){body{padding:22px}.poster { min-height:min(960px,calc(100dvh - 44px)); aspect-ratio:9/16; } .masthead{padding-top:25px}.artwork{min-height:300px}.closing{padding-bottom:27px} }
@media (max-width:380px) { .masthead{padding:15px 21px 0}.sun-badge{width:71px;height:71px;font-size:31px}.title-wrap{padding-top:17px}h1{font-size:clamp(49px,13vw,58px)}.artwork{margin:0 3px;min-height:275px}.closing{padding:17px 21px max(19px,env(safe-area-inset-bottom))}.closing h2{font-size:28px}.closing .stamp{right:21px;top:30px;width:28px;height:28px;font-size:16px} }
@media (max-height:700px) and (max-width:599px) { .masthead{padding-top:11px}.title-wrap{padding-top:11px}h1{font-size:clamp(43px,11vw,60px)}.instruction{margin-top:10px}.artwork{min-height:235px}.closing{padding-top:13px;padding-bottom:15px}.closing .rule{margin-top:27px} }
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>

<script>
(() => {
  const poster = document.getElementById('poster');
  const stage = document.getElementById('sushi-stage');
  const pieces = [...document.querySelectorAll('.sushi-piece')];
  const replay = document.getElementById('replay');
  const live = document.getElementById('status');
  let taken = 0;
  let gesture = null;

  function svgPoint(event) {
    const point = stage.createSVGPoint();
    point.x = event.clientX; point.y = event.clientY;
    return point.matrixTransform(stage.getScreenCTM().inverse());
  }
  function removePiece(piece) {
    if (piece.dataset.taken === 'true') return;
    piece.dataset.taken = 'true';
    piece.classList.remove('dragging');
    piece.classList.add('leaving');
    piece.setAttribute('aria-disabled','true');
    piece.setAttribute('tabindex','-1');
    taken += 1;
    if (taken === pieces.length) {
      poster.classList.add('complete');
      live.textContent = '¡Quitaste todo el sushi! ¿Vamos a escalar y por un sushi?';
      setTimeout(() => replay.focus({preventScroll:true}), 540);
    } else {
      live.textContent = `Quitaste una pieza. Quedan ${pieces.length - taken} piezas de sushi.`;
    }
  }
  pieces.forEach(piece => {
    piece.addEventListener('pointerdown', event => {
      if (piece.dataset.taken === 'true') return;
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      const p = svgPoint(event);
      gesture = {piece, pointerId:event.pointerId, start:p, x:p.x, y:p.y, moved:false};
      piece.classList.add('dragging');
      piece.parentNode.appendChild(piece);
      piece.setPointerCapture(event.pointerId);
    });
    piece.addEventListener('pointermove', event => {
      if (!gesture || gesture.piece !== piece || gesture.pointerId !== event.pointerId) return;
      const p = svgPoint(event);
      const dx = p.x-gesture.start.x, dy = p.y-gesture.start.y;
      if (Math.hypot(dx,dy) > 7) gesture.moved = true;
      piece.setAttribute('transform', `${piece.dataset.origin} translate(${dx.toFixed(1)} ${dy.toFixed(1)})`);
    });
    piece.addEventListener('pointerup', event => {
      if (!gesture || gesture.piece !== piece || gesture.pointerId !== event.pointerId) return;
      gesture = null;
      removePiece(piece); // A tap picks it up; a drag physically takes it off the plate.
    });
    piece.addEventListener('pointercancel', event => {
      if (!gesture || gesture.piece !== piece || gesture.pointerId !== event.pointerId) return;
      gesture = null;
      piece.classList.remove('dragging');
      piece.setAttribute('transform',piece.dataset.origin);
    });
    piece.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && piece.dataset.taken !== 'true') {
        event.preventDefault();
        removePiece(piece);
      }
    });
  });
  replay.addEventListener('click', () => {
    poster.classList.remove('complete');
    taken = 0; gesture = null;
    pieces.forEach(piece => {
      piece.dataset.taken = 'false';
      piece.classList.remove('leaving','dragging');
      piece.setAttribute('transform',piece.dataset.origin);
      piece.setAttribute('tabindex','0');
      piece.removeAttribute('aria-disabled');
    });
    live.textContent = 'Hay siete piezas de sushi para retirar.';
    pieces[0].focus({preventScroll:true});
  });
})();
</script>
</body>
</html>
